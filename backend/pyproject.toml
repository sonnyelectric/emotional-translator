[project]
name = "emotional-translator-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "pydantic==2.11.5",
    "jsonschema==4.24.0",
    "referencing==0.36.2",
    "python-dotenv==1.1.0",
    "websockets==15.0.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.3.5"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
